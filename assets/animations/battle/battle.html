<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Битва</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      height: 100%;
      overflow: hidden; /* чтобы не было скролла */
    }
  </style>
</head>
<body>

<!-- PIXI -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

<!-- pixi-spine -->
<script src="https://cdn.jsdelivr.net/npm/pixi-spine@3.1.2/dist/pixi-spine.umd.js"></script>

<script>
  const app = new PIXI.Application({
    resizeTo: window,
    backgroundAlpha: 0
  });

  document.body.appendChild(app.view);

  app.loader
    .add("spine", "battle_sk.json")
    .load((loader, resources) => {

      const spine = new PIXI.spine.Spine(resources.spine.spineData);

      // позиция
      spine.x = app.screen.width / 2;
      spine.y = app.screen.height * 1.1;

      // размер
      spine.scale.set(0.4);

      // запускаем анимацию
      spine.state.setAnimation(0, "animation", true);

      app.stage.addChild(spine);

      // адаптация при ресайзе
      window.addEventListener("resize", () => {
        spine.x = app.screen.width / 2;
        spine.y = app.screen.height * 0.85;
      });
    });
</script>

</body>
</html>
